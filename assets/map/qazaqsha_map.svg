<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1160">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17384a"/><stop offset=".5" stop-color="#102c3e"/><stop offset="1" stop-color="#071522"/></linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#244b45"/><stop offset="1" stop-color="#163b3a"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".28"/></filter>
</defs>

<rect width="430" height="1160" fill="url(#bg)"/>
<!-- subtle terrain -->
<path d="M0 0H430V180C350 140 290 205 210 170S70 155 0 205Z" fill="#1b414d" opacity=".55"/>
<path d="M0 970C90 920 155 990 220 950S350 925 430 970V1160H0Z" fill="url(#ground)" opacity=".75"/>
<g fill="none" stroke="#3b6260" stroke-width="2" opacity=".35">
  <path d="M-30 250C100 190 170 290 300 220S470 230 470 230"/>
  <path d="M-20 500C90 440 180 540 290 470S470 480 470 480"/>
  <path d="M-20 760C100 700 170 810 310 735S470 750 470 750"/>
</g>

<!-- destination islands / yards -->
<g filter="url(#shadow)">
  <ellipse cx="215" cy="1035" rx="115" ry="45" fill="#0b1f2d" opacity=".75"/>
  <ellipse cx="105" cy="835" rx="88" ry="34" fill="#0b1f2d" opacity=".75"/>
  <ellipse cx="320" cy="635" rx="88" ry="34" fill="#0b1f2d" opacity=".75"/>
  <ellipse cx="110" cy="435" rx="88" ry="34" fill="#0b1f2d" opacity=".75"/>
  <ellipse cx="300" cy="235" rx="88" ry="34" fill="#0b1f2d" opacity=".75"/>
</g>

<!-- HOME -->
<g transform="translate(62 780)" filter="url(#shadow)">
  <path d="M0 48L43 8L86 48V104H0Z" fill="#d9a95d" stroke="#f1d18b" stroke-width="3"/>
  <path d="M-7 49L43 0L93 49L86 55L43 17L0 55Z" fill="#8c4e49"/>
  <rect x="15" y="60" width="18" height="20" rx="2" fill="#83b9c0"/>
  <rect x="53" y="60" width="18" height="20" rx="2" fill="#83b9c0"/>
  <rect x="37" y="73" width="13" height="31" fill="#704a3a"/>
</g>

<!-- HOSPITAL -->
<g transform="translate(277 575)" filter="url(#shadow)">
  <rect x="0" y="30" width="86" height="75" rx="6" fill="#e5edf0" stroke="#9dc2c8" stroke-width="3"/>
  <rect x="30" y="8" width="26" height="97" rx="4" fill="#e5edf0" stroke="#9dc2c8" stroke-width="3"/>
  <path d="M43 31V61M28 46H58" stroke="#d85f65" stroke-width="10" stroke-linecap="round"/>
  <rect x="11" y="57" width="15" height="18" fill="#84b8c0"/><rect x="60" y="57" width="15" height="18" fill="#84b8c0"/>
</g>

<!-- RESTAURANT -->
<g transform="translate(67 382)" filter="url(#shadow)">
  <rect x="0" y="40" width="86" height="64" rx="7" fill="#c87855" stroke="#e7b77d" stroke-width="3"/>
  <path d="M-4 42H90" stroke="#f0c66e" stroke-width="18"/>
  <path d="M8 42V58M28 42V58M48 42V58M68 42V58" stroke="#fff1d0" stroke-width="10"/>
  <rect x="30" y="68" width="25" height="36" fill="#704a3a"/>
</g>

<!-- SCHOOL -->
<g transform="translate(257 180)" filter="url(#shadow)">
  <path d="M0 35L45 2L90 35V108H0Z" fill="#d8c47b" stroke="#f0df9a" stroke-width="3"/>
  <path d="M-7 36L45 0L97 36L90 44L45 11L0 44Z" fill="#557f9e"/>
  <g fill="#8abcc2"><rect x="13" y="52" width="13" height="19"/><rect x="38" y="52" width="13" height="19"/><rect x="63" y="52" width="13" height="19"/></g>
  <rect x="38" y="77" width="14" height="31" fill="#704a3a"/>
</g>

<!-- TANYSSU welcome camp (no building) -->
<g transform="translate(177 980)" filter="url(#shadow)">
  <path d="M38 0L78 72H-2Z" fill="#bd6f54" stroke="#f0c080" stroke-width="3"/>
  <path d="M38 0L38 72" stroke="#f5d7a0" stroke-width="3"/>
  <path d="M18 72H58" stroke="#d99c60" stroke-width="8" stroke-linecap="round"/>
</g>

<!-- decorative Kazakh-inspired ornaments -->
<g fill="none" stroke="#d9a95d" stroke-width="2" opacity=".28">
 <path d="M22 310q18-18 36 0t36 0t36 0"/>
 <path d="M300 880q18-18 36 0t36 0t36 0"/>
 <circle cx="36" cy="670" r="5"/><circle cx="394" cy="350" r="5"/><circle cx="35" cy="1050" r="5"/>
</g>

<!-- route under Flutter's interactive buttons -->
<path d="M215 1035 C205 950 125 930 105 835 S220 700 320 635 S190 515 110 435 S205 310 300 235" fill="none" stroke="#d9a95d" stroke-width="3" stroke-dasharray="2 16" stroke-linecap="round" opacity=".5"/>

<!-- labels belong to the map art; Flutter repeats them cleanly beneath buildings -->
<g font-family="sans-serif" text-anchor="middle" fill="#dcebe9">
 <text x="105" y="948" font-size="18" font-weight="800">ҮЙ</text>
 <text x="320" y="748" font-size="18" font-weight="800">АУРУХАНА</text>
 <text x="110" y="548" font-size="18" font-weight="800">ТАМАҚ</text>
 <text x="300" y="348" font-size="18" font-weight="800">МЕКТЕП</text>
</g>

<!-- compass -->
<g transform="translate(28 34)">
 <circle cx="20" cy="20" r="19" fill="#0b2233" stroke="#d9a95d" stroke-width="2"/>
 <path d="M20 7L24 20L20 17L16 20Z" fill="#d9a95d"/>
 <text x="20" y="34" text-anchor="middle" font-size="8" fill="#dcebe9" font-family="sans-serif" font-weight="800">N</text>
</g>
</svg>
<path d="M215 1035 C205 950 125 930 105 835 S220 700 320 635 S190 515 110 435 S205 310 300 235"
      fill="none" stroke="url(#road)" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M215 1035 C205 950 125 930 105 835 S220 700 320 635 S190 515 110 435 S205 310 300 235"
      fill="none" stroke="#ecd69f" stroke-width="3" stroke-dasharray="3 15" stroke-linecap="round" opacity=".8"/>


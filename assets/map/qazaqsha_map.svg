<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1160">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#8cc7df"/><stop offset=".42" stop-color="#b9dca7"/><stop offset="1" stop-color="#6ca56b"/>
  </linearGradient>
  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#8fbd72"/><stop offset="1" stop-color="#4e8757"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#73c9df"/><stop offset=".55" stop-color="#3d9fc1"/><stop offset="1" stop-color="#287ea8"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#d9bd82"/><stop offset="1" stop-color="#a88457"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".28"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
</defs>

<!-- NATURAL MAP -->
<rect width="430" height="1160" fill="url(#grass)"/>
<path d="M0 0H430V260C350 210 310 270 235 235S85 250 0 185Z" fill="#9bd0df" opacity=".72"/>
<path d="M0 190C75 155 120 215 190 190S325 145 430 215V0H0Z" fill="url(#sky)" opacity=".72"/>

<!-- hills -->
<path d="M0 300Q55 240 110 300T220 295T330 300T430 270V0H0Z" fill="#77a968" opacity=".35"/>
<path d="M0 1080Q80 1000 150 1055T290 1030T430 1065V1160H0Z" fill="#3e7650" opacity=".45"/>

<!-- river -->
<path d="M405 -20 C350 100 390 205 320 295 C255 380 300 455 225 535 C150 615 185 710 105 790 C35 860 70 965 15 1035 L-20 1090 L-20 1160 L55 1160 C115 1060 95 970 155 895 C225 810 205 715 280 630 C350 550 300 455 370 365 C430 285 390 170 445 60Z"
      fill="url(#water)" stroke="#d5f3f6" stroke-width="4" opacity=".94"/>
<path d="M395 20C350 130 375 205 310 300S285 470 215 545S175 710 95 805S75 965 25 1040"
      fill="none" stroke="#b9edf2" stroke-width="5" opacity=".55"/>


 <g transform="translate(365 300)"><rect x="17" y="34" width="8" height="25" fill="#704b32"/><circle cx="21" cy="26" r="24" fill="#34724d"/><circle cx="8" cy="35" r="15" fill="#43835a"/><circle cx="35" cy="37" r="15" fill="#43835a"/></g>

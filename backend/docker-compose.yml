services:
  qazaqsha-content:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: sqlite:///./data/qazaqsha_content.db
      JWT_SECRET: change-this-to-a-long-random-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-this-admin-password
    volumes:
      - ./data:/app/data

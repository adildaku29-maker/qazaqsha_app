<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qazaqsha Admin</title>
<style>body{margin:0;font:14px system-ui;background:#071522;color:#edf5f6}header{padding:20px 28px;background:#0b2233;position:sticky;top:0;z-index:3}h1{margin:0 0 5px}main{max-width:1200px;margin:auto;padding:24px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button,button{border:0;border-radius:12px;padding:10px 14px;background:#102a3d;color:#fff;cursor:pointer}.tabs button.active,button.primary{background:#16c7b7;color:#061a20}.card{background:#102a3d;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,select,textarea{width:100%;box-sizing:border-box;background:#071b29;color:#fff;border:1px solid #29495c;border-radius:10px;padding:10px}label{display:block;color:#91a5b5;margin:7px 0}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #29495c;text-align:left}.muted{color:#91a5b5}.hide{display:none}.danger{background:#7d3030}</style></head>
<body><header><h1>Qazaqsha Content Admin</h1><span class="muted">Тематики → уроки → вопросы → пользователи</span></header><main>
<section id="login" class="card"><h2>Вход администратора</h2><label>Логин</label><input id="user" value="admin"><label>Пароль</label><input id="pass" type="password"><br><button class="primary" onclick="login()">Войти</button><span id="loginMsg"></span></section>
<section id="app" class="hide"><div class="tabs"><button onclick="tab('dash')">Обзор</button><button onclick="tab('topics')">Тематики</button><button onclick="tab('questions')">Вопросы</button><button onclick="tab('users')">Пользователи</button></div>
<div id="dash" class="panel"><div id="stats" class="grid"></div></div>
<div id="topics" class="panel hide"><div class="card"><h2>Тематики</h2><div id="topicList"></div></div><div class="card"><h2>Новая тематика</h2><div class="grid"><div><label>slug</label><input id="tslug"></div><div><label>Название</label><input id="ttitle"></div><div><label>Описание</label><input id="tsub"></div><div><label>Emoji</label><input id="temoji" value="📚"></div><div><label>Уровень</label><input id="tlevel" value="A1"></div><div><label>Открывается после</label><input id="treq"></div></div><br><button class="primary" onclick="createTopic()">Создать</button></div></div>
<div id="questions" class="panel hide"><div class="card"><h2>Вопросы</h2><div class="grid"><div><label>Тематика</label><select id="qtopic" onchange="loadLessons()"></select></div><div><label>Урок</label><select id="qlesson" onchange="loadQuestions()"></select></div></div></div><div class="card"><h3>Вопросы урока</h3><div id="qList"></div></div><div class="card"><h3 id="qTitle">Новый вопрос</h3><input type="hidden" id="qid"><div class="grid"><div><label>Тип</label><select id="qtype"><option value="translation">Перевод</option><option value="matching">Сопоставление</option><option value="fill">Пропуск</option><option value="speaking">Голос</option></select></div><div><label>Audio key</label><input id="qaudio"></div><div><label>Порядок</label><input id="qsort" type="number" value="0"></div><div><label>Правильный индекс</label><input id="qcorrect" type="number" value="0"></div></div><label>Қазақша</label><textarea id="qkk"></textarea><label>Русский</label><textarea id="qru"></textarea><label>English</label><textarea id="qen"></textarea><label>Варианты (каждый с новой строки)</label><textarea id="qoptions"></textarea><label>Правильный ответ текстом</label><input id="qanswer"><br><button class="primary" onclick="saveQuestion()">Сохранить</button> <button onclick="clearQuestion()">Очистить</button></div></div>
<div id="users" class="panel hide"><div class="card"><h2>Пользователи</h2><div id="usersList"></div></div></div>
</section></main>
<script>
var token=localStorage.qz_admin||'',topics=[];
function $(id){return document.getElementById(id)}
async function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{},token?{'Authorization':'Bearer '+token}:{});var r=await fetch(path,opt);if(!r.ok)throw Error(await r.text());return r.json()}
async function login(){try{var d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('pass').value})});token=d.access_token;localStorage.qz_admin=token;$('login').classList.add('hide');$('app').classList.remove('hide');loadAll()}catch(e){$('loginMsg').textContent='  Ошибка входа'}}
function tab(id){document.querySelectorAll('.panel').forEach(function(x){x.classList.add('hide')});$(id).classList.remove('hide');if(id==='questions')fillTopicSelect();if(id==='users')loadUsers()}
async function loadAll(){loadStats();loadTopics();loadUsers()}
async function loadStats(){var s=await api('/api/admin/stats');$('stats').innerHTML=Object.keys(s).map(function(k){return '<div class="card"><b>'+k+'</b><h2>'+s[k]+'</h2></div>'}).join('')}
async function loadTopics(){topics=await api('/api/admin/topics');$('topicList').innerHTML=topics.map(function(t){return '<div class="card"><b>'+t.emoji+' '+t.title+'</b> · '+t.level+'<br><span class="muted">'+t.slug+' · открывается после: '+(t.required_after||'старт')+'</span></div>'}).join('');fillTopicSelect()}
function fillTopicSelect(){$('qtopic').innerHTML=topics.map(function(t){return '<option value="'+t.id+'">'+t.emoji+' '+t.title+'</option>'}).join('');loadLessons()}
async function loadLessons(){var id=$('qtopic').value;if(!id)return;var ls=await api('/api/admin/lessons?topic_id='+id);$('qlesson').innerHTML=ls.map(function(l){return '<option value="'+l.id+'">№'+l.number+' — '+l.title+(l.kind==='exam'?' 🏆':'')+'</option>'}).join('');loadQuestions()}
function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
async function loadQuestions(){var id=$('qlesson').value;if(!id)return;var qs=await api('/api/admin/questions?lesson_id='+id);$('qList').innerHTML=qs.map(function(q){return '<div class="card"><b>#'+q.id+' · '+q.type+'</b><br>'+esc(q.prompt_kk)+'<br><span class="muted">'+esc(q.prompt_ru)+'</span><br><button onclick="editQ('+q.id+')">Редактировать</button> <button class="danger" onclick="delQ('+q.id+')">Удалить</button></div>'}).join('')||'<span class="muted">Пока нет вопросов.</span>'}
async function saveQuestion(){var id=$('qid').value;var body={lesson_id:+$('qlesson').value,type:$('qtype').value,prompt_kk:$('qkk').value,prompt_ru:$('qru').value,prompt_en:$('qen').value,options:$('qoptions').value.split('\n').map(function(x){return x.trim()}).filter(Boolean),correct_index:+$('qcorrect').value,answer_kk:$('qanswer').value,audio_key:$('qaudio').value,sort_order:+$('qsort').value,active:true};await api(id?'/api/admin/questions/'+id:'/api/admin/questions',{method:id?'PUT':'POST',body:JSON.stringify(body)});clearQuestion();loadQuestions();loadStats()}
async function editQ(id){var qs=await api('/api/admin/questions?lesson_id='+$('qlesson').value),q=qs.find(function(x){return x.id===id});if(!q)return;$('qid').value=q.id;$('qtype').value=q.type;$('qkk').value=q.prompt_kk;$('qru').value=q.prompt_ru;$('qen').value=q.prompt_en;$('qoptions').value=q.options.join('\n');$('qcorrect').value=q.correct_index||0;$('qanswer').value=q.answer_kk;$('qaudio').value=q.audio_key;$('qsort').value=q.sort_order;$('qTitle').textContent='Редактирование #'+q.id}
async function delQ(id){if(confirm('Удалить вопрос?')){await api('/api/admin/questions/'+id,{method:'DELETE'});loadQuestions();loadStats()}}
function clearQuestion(){$('qid').value='';$('qkk').value='';$('qru').value='';$('qen').value='';$('qoptions').value='';$('qanswer').value='';$('qaudio').value='';$('qsort').value='0';$('qTitle').textContent='Новый вопрос'}
async function createTopic(){await api('/api/admin/topics',{method:'POST',body:JSON.stringify({slug:$('tslug').value,title:$('ttitle').value,subtitle:$('tsub').value,emoji:$('temoji').value,level:$('tlevel').value,xp:100,sort_order:topics.length,required_after:$('treq').value||null})});loadAll()}
async function loadUsers(){try{var u=await api('/api/admin/users');$('usersList').innerHTML='<table><tr><th>Имя</th><th>Язык</th><th>Цель</th><th>Пройдено</th><th>Последний вход</th></tr>'+u.map(function(x){return '<tr><td>'+esc(x.nickname)+'</td><td>'+x.language+'</td><td>'+esc(x.goal)+'</td><td>'+x.passed_stages+'</td><td>'+x.last_seen_at+'</td></tr>'}).join('')+'</table>'}catch(e){}}
if(token){$('login').classList.add('hide');$('app').classList.remove('hide');loadAll()}
</script></body></html>
